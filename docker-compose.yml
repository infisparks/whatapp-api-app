version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/whatsapp_db?schema=public
      - NEXT_PUBLIC_META_APP_ID=${NEXT_PUBLIC_META_APP_ID:-3457567954401110}
      - META_APP_ID=${META_APP_ID:-3457567954401110}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_EMBEDDED_SIGNUP_CONFIG_ID=${META_EMBEDDED_SIGNUP_CONFIG_ID:-1084755870646567}
      - NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID=${NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID:-1084755870646567}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - META_SYSTEM_USER_TOKEN=${META_SYSTEM_USER_TOKEN}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_WEBHOOK_URL=${WHATSAPP_WEBHOOK_URL:-https://aiwh.infiplus.in/api/v1/whatsapp/webhook}
      - APP_URL=${APP_URL:-https://aiwh.infiplus.in}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://aiwh.infiplus.in}
      - META_OAUTH_REDIRECT_URI=${META_OAUTH_REDIRECT_URI:-https://aiwh.infiplus.in/dashboard/whatsapp/connect}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://aiwh.infiplus.in}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: whatsapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d whatsapp_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
